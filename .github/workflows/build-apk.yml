name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore, Environment and Google Services
        run: |
          chmod +x ./gradlew
          
          # Restore or generate debug.keystore
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64"
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore"
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # Ensure google-services.json exists
          if [ ! -f app/google-services.json ]; then
            echo "Creating fallback app/google-services.json"
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "140084369102",
              "project_id": "goli-accounting-erp",
              "storage_bucket": "goli-accounting-erp.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:140084369102:android:65a4bc837d9210ef821bc1",
                  "android_client_info": {
                    "package_name": "com.aistudio.goliaccounting.kxrvzt"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGoliAccountingOnlineSync123"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run Tests
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Direct APK Output
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/GoliAccounting.apk
          echo "APK successfully generated: build-output/GoliAccounting.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoliAccounting-APK
          path: build-output/GoliAccounting.apk
          retention-days: 30
          compression-level: 0

      - name: Publish Direct APK to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Goli Accounting Latest APK"
          body: "Direct download of Goli Accounting Android APK (ready-to-install without unzipping)."
          draft: false
          prerelease: false
          files: build-output/GoliAccounting.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
