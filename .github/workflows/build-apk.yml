name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Build Environment
        run: |
          chmod +x ./gradlew
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare Direct APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/GoliAccounting.apk
          echo "APK successfully built at build-output/GoliAccounting.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoliAccounting-APK
          path: build-output/GoliAccounting.apk
          retention-days: 30
          compression-level: 0

      - name: Publish Direct APK to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Goli Accounting Latest APK"
          body: "Direct download of Goli Accounting Android APK (ready-to-install without unzipping)."
          draft: false
          prerelease: false
          files: build-output/GoliAccounting.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
